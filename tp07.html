<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP07 - Modale Bootstrap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

    <h1>TP07 - Modale Bootstrap</h1>

    <!-- Bouton pour ouvrir la modale -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#maModale">
        Ouvrir la modale
    </button>

    <!-- Modale -->
    <div class="modal fade" id="maModale" tabindex="-1" aria-labelledby="titreModale" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Header avec titre et bouton fermer -->
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="titreModale">Titre de la modale</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>

                <!-- Body avec texte -->
                <div class="modal-body">
                    <p>Ceci est le contenu de la modale. Vous pouvez y mettre n'importe quel texte, formulaire ou autre contenu HTML.</p>
                    <p>Bienvenue dans ce TP sur les modales Bootstrap !</p>
                </div>

                <!-- Footer avec bouton fermer -->
                <div class="modal-footer bg-secondary">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Fermer</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS (nécessaire pour le fonctionnement de la modale) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
